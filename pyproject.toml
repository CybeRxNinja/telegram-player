[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-player"
version = "0.1.16"
description = "Minimal Telegram video player (Telethon + bundled mpv, streamed via byte-range HTTP)"
requires-python = ">=3.10"
dependencies = [
    "telethon==1.44.0",
    "PyQt6==6.11.0",
    "segno==1.6.6",
]

[project.scripts]
telegram-player = "telegram_player.app:main"

[tool.setuptools.packages.find]
include = ["telegram_player*"]