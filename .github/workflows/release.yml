name: build-release

# Builds the Telegram Player AppImage and publishes it as a GitHub Release.
#
# - Weekly (Monday 04:17 UTC): produces a rolling *nightly* prerelease so the
#   in-app updater can pull a fresh build at a regular interval.
# - Manual (workflow_dispatch): pass any tag (e.g. v0.1.18) to cut a stable
#   release; the embedded version in pyproject.toml is bumped to match.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (use 'nightly' for the rolling build)"
        required: true
        default: "nightly"
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache build toolchain
        uses: actions/cache@v4
        with:
          path: build/dl
          key: appimage-build-dl-${{ github.sha }}
          restore-keys: |
            appimage-build-dl-

      - name: Install system deps (Qt runtime + mpv build toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential git ninja-build pkg-config meson             libssl-dev libffi-dev python3-dev             xvfb libegl1 libgl1 libgl1-mesa-dri libglu1-mesa             libglib2.0-0 libfontconfig1 libfreetype6 libxkbcommon0 libdbus-1-3             libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-cursor0 libxcb-util1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.22.0

      # Provide a static mpv so the AppImage build never has to compile mpv
      # from source. Mirrors the build script's pkgforge fallback; cached
      # between runs via the build/dl cache above.
      - name: Pre-seed mpv (static build)
        run: |
          set -e
          mkdir -p build/dl
          if [ ! -x build/dl/mpv/mpv ]; then
            PKG=mpv-v0.41.0-anylinux-x86_64.AppImage
            URL="https://github.com/pkgforge-dev/mpv-AppImage/releases/download/v0.41.0@2026-07-01_1782914175/$PKG"
            curl -fsSL --retry 3 -o "build/dl/$PKG" "$URL"
            chmod +x "build/dl/$PKG"
            ( cd build/dl && APPIMAGE_EXTRACT_AND_RUN=1 "../$PKG" --appimage-extract >/dev/null )
            mkdir -p build/dl/mpv build/dl/mpv-libs
            cp -a build/dl/squashfs-root/shared/bin/mpv build/dl/mpv/mpv
            cp -a build/dl/squashfs-root/lib/. build/dl/mpv-libs 2>/dev/null || true
            rm -rf build/dl/squashfs-root
          fi

      - name: Set version from tag (stable releases only)
        if: ${{ (github.event.inputs.tag || 'nightly') != 'nightly' }}
        run: |
          VER="${{ github.event.inputs.tag }}"
          VER="${VER#v}"
          sed -i "s/^version = .*/version = "$VER"/" pyproject.toml

      - name: Build AppImage
        run: |
          mkdir -p build/dl
          bash build/build_appimage.sh

      # Rolling nightly: remove the previous release/tag before recreating.
      - name: Delete previous nightly (rolling)
        if: ${{ (github.event.inputs.tag || 'nightly') == 'nightly' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly -y || true
          git push --delete origin nightly || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'nightly' }}
          prerelease: ${{ github.event.inputs.prerelease || true }}
          make_latest: false
          files: dist/Telegram-Player-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
