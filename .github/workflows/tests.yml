name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # offscreen is the most stable headless Qt platform for CI: no X server
      # and no GL context teardown, which previously caused intermittent
      # segfaults under xvfb.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Qt/EGL runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libglib2.0-0 libfontconfig1 libfreetype6             libxkbcommon0 libdbus-1-3 libxcb-xinerama0 libxcb-icccm4             libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0             libxcb-shape0 libxcb-cursor0 libxcb-util1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: python -m pytest -q
